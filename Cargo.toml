[package]
name = "ebi-to-gcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.28"
polars = { version = "0.49.1", features = [
    "ipc",
    "lazy",
    "parquet",
    "strings",
] }
rayon = "1.11.0"
regex = "1.11.1"
serde = "1.0.219"
serde_yaml = "0.9.34"
tokio = { version = "1.46.1", features = ["full"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.8"
uuid = { version = "1.6", features = ["v4"] }
rand = "0.8"
