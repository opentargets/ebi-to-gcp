[package]
name = "ebi-to-gcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
polars = { version = "0.49.1", features = ["ipc", "lazy", "parquet", "strings"] }
regex = "1.11.1"
serde = "1.0.219"
serde_yaml = "0.9.34"
tokio = { version = "1.46.1", features = ["full"] }
walkdir = "2.5.0"
